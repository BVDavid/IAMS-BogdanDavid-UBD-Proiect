<!doctype html>
<html lang="en">
<head>
    <title>Adaugă Echipament Nou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-bs-theme="dark">
<div class="container mt-5">
    <h2>Adaugă Echipament Nou</h2>
    <div class="card mt-4">
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Host Name</label>
                    <input type="text" name="host_name" class="form-control" required placeholder="Ex: NEW-SERVER-01">
                </div>
                <div class="mb-3">
                    <label class="form-label">Serial Number</label>
                    <input type="text" name="serial_number" class="form-control" required placeholder="Ex: SN-99999">
                </div>
                <div class="mb-3">
                    <label class="form-label">IP Address</label>
                    <input type="text" name="ip_address" class="form-control" placeholder="Ex: 192.168.1.200">
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="Active">Active</option>
                            <option value="Repair">Repair</option>
                            <option value="Retired">Retired</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Locație</label>
                        <select name="location_id" class="form-select">
                            {% for loc in locations %}
                                <option value="{{ loc['location_id'] }}">{{ loc['room_name'] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Utilizator</label>
                        <select name="user_id" class="form-select">
                            {% for user in users %}
                                <option value="{{ user['user_id'] }}">{{ user['first_name'] }} {{ user['last_name'] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Salvează Echipament</button>
                <a href="/" class="btn btn-secondary">Anulează</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
