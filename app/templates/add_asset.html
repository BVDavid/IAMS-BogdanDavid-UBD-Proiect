<!doctype html>
<html lang="en">
<head>
    <title>Adaugă Echipament</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-bs-theme="dark" class="p-5">
<div class="container">
    <h2>Adaugă Echipament</h2>

    {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <strong>Eroare:</strong> {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endif %}

    <form method="post" class="mt-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Host Name</label>
                <input type="text" name="host_name" class="form-control" required
                       placeholder="Ex: DESKTOP-01" pattern="[a-zA-Z0-9-]+" title="Litere, cifre, cratima">
            </div>
            <div class="col-md-6 mb-3">
                <label>Serial Number</label>
                <input type="text" name="serial_number" class="form-control" required
                       placeholder="Ex: SN12345" pattern="[a-zA-Z0-9-]+" title="Alfanumeric">
            </div>
        </div>

        <div class="mb-3">
            <label>IP Address</label>
            <input type="text" name="ip_address" class="form-control"
                   placeholder="Ex: 192.168.1.10" pattern="^([0-9]{1,3}\.){3}[0-9]{1,3}$">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="text-warning">Data Achizitiei *</label>
                <input type="date" name="purchase_date" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="text-info">Garantie pana la </label>
                <input type="date" name="warranty_date" class="form-control">
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Status</label>
                <select name="status" class="form-select">
                    <option value="Active">Active</option>
                    <option value="Repair">Repair</option>
                    <option value="Retired">Retired</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label>Locație</label>
                <select name="location_id" class="form-select">
                    {% for loc in locations %}
                        <option value="{{ loc['location_id'] }}">{{ loc['room_name'] }}</option>
                    {% endfor %}
                </select>
            </div>

            {% if user_role == 'admin' %}
                <div class="col-md-4 mb-3">
                    <label>Proprietar</label>
                    <select name="user_id" class="form-select">
                        {% for user in users %}
                            <option value="{{ user['user_id'] }}">{{ user['first_name'] }} {{ user['last_name'] }}</option>
                        {% endfor %}
                    </select>
                </div>
            {% else %}
                <input type="hidden" name="user_id" value="{{ current_user_id }}">
            {% endif %}
        </div>

        <button type="submit" class="btn btn-primary">Salvează</button>
        <a href="/" class="btn btn-secondary">Anulează</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
