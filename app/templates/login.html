<!doctype html>
<html lang="en">
<head>
    <title>Login - IAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card bg-secondary p-4 shadow" style="width: 350px;">
    <h3 class="text-center mb-4"><i class="bi bi-shield-lock"></i> IAMS Login</h3>
    {% if error %}
        <div class="alert alert-danger p-2">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required placeholder="admin@test.com">
        </div>
        <div class="mb-4">
            <label class="form-label">Parolă</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Autentificare</button>
    </form>
    <div class="mt-3 text-center small text-light opacity-50">
        User: admin@test.com / admin123<br>
        User: user@test.com / user123
    </div>
</div>
</body>
</html>
